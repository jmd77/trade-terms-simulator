<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Trade terms simulator, overview video</title>
<link rel="icon" href="data:,">
<style>
@font-face {
  font-family: 'Montserrat';
  src: url('../fonts/montserrat-latin-wght-normal.woff2') format('woff2');
  font-weight: 100 900;
  font-display: swap;
}
:root { --navy: #232341; --green: #28A878; --green-dark: #1F8F65; --muted: #5F6680; }
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Montserrat', system-ui, sans-serif; color: var(--navy); background: #fff; }
main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 48px; }
h1 { font-size: 26px; line-height: 1.2; font-weight: 800; margin: 0 0 6px; }
h1 span { color: var(--green); }
.sub { margin: 0 0 20px; color: var(--muted); font-size: 15px; font-weight: 500; }
video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; box-shadow: 0 6px 24px rgba(35, 35, 65, .15); }
.row { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; justify-content: space-between; margin-top: 20px; }
.note { margin: 0; color: var(--muted); font-size: 14px; font-weight: 500; }
.btn { display: inline-block; padding: 12px 26px; border-radius: 999px; background: var(--green); color: #fff; font-size: 15px; font-weight: 700; text-decoration: none; }
.btn:hover, .btn:focus-visible { background: var(--green-dark); }
</style>
</head>
<body>
<main>
  <h1>Trade terms <span>simulator</span></h1>
  <p class="sub">Overview video, 86 seconds, with sound</p>
  <video controls playsinline preload="metadata" poster="poster.png">
    <source src="overview.mp4" type="video/mp4">
    Your browser cannot play this video. <a href="overview.mp4">Download the video</a>.
  </video>
  <div class="row">
    <p class="note">An illustration with invented data.</p>
    <a class="btn" href="../">Try the tool yourself</a>
  </div>
</main>
</body>
</html>
